<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Inter:wght@400;500&display=swap');
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:#FAF7F0; color:#1E2A22; overflow:hidden;}
  .nav{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:#1B4332; color:#fff;}
  .nav .logo{font-family:'Poppins',sans-serif; font-weight:800; font-size:13px;}
  .nav .links{display:flex; gap:12px; font-size:9px; opacity:0.85;}
  .hero{padding:20px 16px 16px; text-align:center;}
  .hero h1{font-family:'Poppins',sans-serif; font-weight:800; font-size:16px; color:#1B4332; line-height:1.3;}
  .hero p{font-size:10px; color:#5C6B60; margin-top:6px;}
  .hero .btn{display:inline-block; margin-top:10px; background:#2D6A4F; color:#fff; font-size:9px; font-weight:700; padding:6px 14px; border-radius:20px;}
  .cards{display:flex; gap:8px; padding:0 16px 16px;}
  .card{flex:1; background:#fff; border-radius:8px; padding:10px; box-shadow:0 2px 6px rgba(0,0,0,0.05);}
  .card .icon{width:22px; height:22px; border-radius:50%; background:#D8F3DC;}
  .card .t{font-size:9px; font-weight:700; margin-top:6px; color:#1B4332;}
  .card .d{font-size:7.5px; color:#8A9690; margin-top:3px;}
</style></head>
<body>
  <div class="nav">
    <div class="logo">Greenwood Academy</div>
    <div class="links"><span>Home</span><span>Admissions</span><span>Faculty</span><span>Contact</span></div>
  </div>
  <div class="hero">
    <h1>Shaping bright futures,<br>one student at a time</h1>
    <p>Admissions open for 2026 — book a campus tour today</p>
    <div class="btn">Apply Now</div>
  </div>
  <div class="cards">
    <div class="card"><div class="icon"></div><div class="t">Admissions</div><div class="d">Simple online form</div></div>
    <div class="card"><div class="icon"></div><div class="t">Faculty</div><div class="d">Meet our teachers</div></div>
    <div class="card"><div class="icon"></div><div class="t">Events</div><div class="d">School calendar</div></div>
  </div>
</body></html>
