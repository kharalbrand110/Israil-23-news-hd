<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500&display=swap');
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:#FFF6F8; color:#3A1420; overflow:hidden;}
  .nav{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:#fff; border-bottom:1px solid #F5D9E0;}
  .nav .logo{font-family:'Manrope',sans-serif; font-weight:800; font-size:13px; color:#C4265A;}
  .nav .icons{display:flex; gap:10px; font-size:11px; color:#C4265A;}
  .hero{padding:16px; display:flex; align-items:center; justify-content:space-between;}
  .hero h1{font-family:'Manrope',sans-serif; font-weight:800; font-size:15px; max-width:55%; line-height:1.3;}
  .hero .badge{background:#C4265A; color:#fff; font-size:8px; font-weight:700; padding:5px 10px; border-radius:20px;}
  .products{display:flex; gap:8px; padding:0 16px 16px;}
  .product{flex:1; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 2px 6px rgba(196,38,90,0.08);}
  .product .thumb{height:34px; background:linear-gradient(135deg,#F8C3D3,#F2A0BC);}
  .product .body{padding:7px;}
  .product .t{font-size:8px; font-weight:700;}
  .product .p{font-size:9px; font-weight:800; color:#C4265A; margin-top:3px;}
</style></head>
<body>
  <div class="nav">
    <div class="logo">Bloom Boutique</div>
    <div class="icons"><span>♡</span><span>🛒</span></div>
  </div>
  <div class="hero">
    <h1>New Autumn Collection</h1>
    <div class="badge">Shop Now</div>
  </div>
  <div class="products">
    <div class="product"><div class="thumb"></div><div class="body"><div class="t">Silk Scarf</div><div class="p">$34.00</div></div></div>
    <div class="product"><div class="thumb"></div><div class="body"><div class="t">Tote Bag</div><div class="p">$58.00</div></div></div>
    <div class="product"><div class="thumb"></div><div class="body"><div class="t">Sun Hat</div><div class="p">$26.00</div></div></div>
  </div>
</body></html>
