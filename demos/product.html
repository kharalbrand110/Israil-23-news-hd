<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500&display=swap');
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:#12081C; color:#F2ECFA; overflow:hidden;}
  .nav{display:flex; align-items:center; justify-content:space-between; padding:10px 16px;}
  .nav .logo{font-family:'Sora',sans-serif; font-weight:800; font-size:13px;}
  .nav .links{display:flex; gap:12px; font-size:9px; color:#B9A9D6;}
  .hero{padding:14px 16px 10px; text-align:center;}
  .hero .kicker{font-size:8px; font-weight:700; color:#B084F0; letter-spacing:0.05em;}
  .hero h1{font-family:'Sora',sans-serif; font-weight:800; font-size:17px; margin-top:6px;}
  .hero p{font-size:9px; color:#B9A9D6; margin-top:5px;}
  .product{display:flex; justify-content:center; padding:8px 16px 12px;}
  .product .box{width:70px; height:70px; border-radius:14px; background:linear-gradient(135deg,#B084F0,#6C3FC5); box-shadow:0 8px 24px rgba(176,132,240,0.35);}
  .specs{display:flex; gap:8px; padding:0 16px 16px; justify-content:center;}
  .spec{background:#1D1130; border:1px solid #34204F; border-radius:7px; padding:6px 10px; text-align:center;}
  .spec .n{font-family:'Sora',sans-serif; font-weight:800; font-size:11px; color:#B084F0;}
  .spec .l{font-size:6.5px; color:#B9A9D6; margin-top:2px;}
</style></head>
<body>
  <div class="nav">
    <div class="logo">Pulse Audio</div>
    <div class="links"><span>Product</span><span>Specs</span><span>Buy</span></div>
  </div>
  <div class="hero">
    <div class="kicker">NEW — PULSE ONE</div>
    <h1>Sound, reimagined</h1>
    <p>Wireless earbuds built for clarity and comfort</p>
  </div>
  <div class="product"><div class="box"></div></div>
  <div class="specs">
    <div class="spec"><div class="n">30h</div><div class="l">Battery</div></div>
    <div class="spec"><div class="n">IPX5</div><div class="l">Water resist</div></div>
    <div class="spec"><div class="n">ANC</div><div class="l">Noise cancel</div></div>
  </div>
</body></html>
