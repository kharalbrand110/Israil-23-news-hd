<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500&display=swap');
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:#FFFBF2; color:#2E2410; overflow:hidden;}
  .nav{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:#7C4A03; color:#fff;}
  .nav .logo{font-family:'Poppins',sans-serif; font-weight:800; font-size:13px;}
  .nav .links{display:flex; gap:12px; font-size:9px; opacity:0.85;}
  .hero{padding:20px 16px 14px;}
  .hero h1{font-family:'Poppins',sans-serif; font-weight:800; font-size:15px; max-width:80%; line-height:1.35; color:#5A3A02;}
  .hero p{font-size:9.5px; color:#8A7550; margin-top:6px;}
  .courses{display:flex; gap:8px; padding:0 16px 16px;}
  .course{flex:1; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 2px 6px rgba(0,0,0,0.05);}
  .course .thumb{height:26px; background:linear-gradient(120deg,#F2B441,#E08E1E);}
  .course .body{padding:8px;}
  .course .t{font-size:8.5px; font-weight:700; color:#5A3A02;}
  .course .bar{height:4px; background:#F1E4C8; border-radius:2px; margin-top:6px; overflow:hidden;}
  .course .fill{height:100%; width:70%; background:#F2B441;}
  .course .pct{font-size:7px; color:#8A7550; margin-top:3px;}
</style></head>
<body>
  <div class="nav">
    <div class="logo">LearnPath Academy</div>
    <div class="links"><span>Courses</span><span>My Learning</span><span>Login</span></div>
  </div>
  <div class="hero">
    <h1>Learn new skills, anytime, anywhere</h1>
    <p>200+ courses taught by industry experts</p>
  </div>
  <div class="courses">
    <div class="course"><div class="thumb"></div><div class="body"><div class="t">Web Design</div><div class="bar"><div class="fill"></div></div><div class="pct">70% complete</div></div></div>
    <div class="course"><div class="thumb"></div><div class="body"><div class="t">Data Basics</div><div class="bar"><div class="fill" style="width:40%"></div></div><div class="pct">40% complete</div></div></div>
    <div class="course"><div class="thumb"></div><div class="body"><div class="t">Marketing 101</div><div class="bar"><div class="fill" style="width:90%"></div></div><div class="pct">90% complete</div></div></div>
  </div>
</body></html>
