<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500&display=swap');
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Inter',sans-serif; background:#F7F8FA; color:#1A2233; overflow:hidden;}
  .nav{display:flex; align-items:center; justify-content:space-between; padding:10px 16px; background:#fff; border-bottom:1px solid #E7EAF0;}
  .nav .logo{font-family:'Manrope',sans-serif; font-weight:800; font-size:13px; color:#1A2233;}
  .nav .links{display:flex; gap:12px; font-size:9px; color:#6B7488;}
  .nav .btn{background:#2A52E0; color:#fff; font-size:8px; font-weight:700; padding:5px 10px; border-radius:5px;}
  .hero{padding:22px 16px 16px;}
  .hero .kicker{font-size:8px; font-weight:700; color:#2A52E0; margin-bottom:6px;}
  .hero h1{font-family:'Manrope',sans-serif; font-weight:800; font-size:16px; line-height:1.3; max-width:70%;}
  .hero p{font-size:9.5px; color:#6B7488; margin-top:8px; max-width:75%;}
  .hero .btn2{display:inline-block; margin-top:10px; background:#1A2233; color:#fff; font-size:9px; font-weight:700; padding:7px 14px; border-radius:6px;}
  .stats{display:flex; gap:10px; padding:0 16px 18px;}
  .stat{flex:1; background:#fff; border:1px solid #E7EAF0; border-radius:8px; padding:10px;}
  .stat .n{font-family:'Manrope',sans-serif; font-weight:800; font-size:14px; color:#2A52E0;}
  .stat .l{font-size:7.5px; color:#6B7488; margin-top:2px;}
</style></head>
<body>
  <div class="nav">
    <div class="logo">Northbridge Consulting</div>
    <div class="links"><span>Services</span><span>About</span><span>Clients</span></div>
    <div class="btn">Contact</div>
  </div>
  <div class="hero">
    <div class="kicker">TRUSTED BUSINESS PARTNER</div>
    <h1>Strategy and growth for ambitious companies</h1>
    <p>We help businesses scale with clear strategy, sharp execution, and measurable results.</p>
    <div class="btn2">Book a Consultation</div>
  </div>
  <div class="stats">
    <div class="stat"><div class="n">120+</div><div class="l">Clients served</div></div>
    <div class="stat"><div class="n">98%</div><div class="l">Satisfaction rate</div></div>
    <div class="stat"><div class="n">15</div><div class="l">Years experience</div></div>
  </div>
</body></html>
